[package]
name = "herdr-repo-picker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A herdr plugin that opens a centered popup pane to fuzzy-pick a ghq repository and jump to its workspace."
license = "MIT"
authors = ["mayaton"]
repository = "https://github.com/mayaton/herdr-repo-picker"
homepage = "https://github.com/mayaton/herdr-repo-picker"
readme = "README.md"
keywords = ["herdr", "tui", "ghq", "ratatui", "fuzzy"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "herdr_repo_picker"
path = "src/lib.rs"

[[bin]]
name = "herdr-repo-picker"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
shell-words = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
